services:
  ubiblio:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DEV: ${DEV:-true}
      DB_LOCATION: ${DB_LOCATION:-/app/config/sql_app.db}
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-/app/config/secret_key.txt}
      SIGNING_KEY_FILE: ${SIGNING_KEY_FILE:-/app/config/sign_key.txt}
      VERIFY_KEY_FILE: ${VERIFY_KEY_FILE:-/app/config/verify_key.txt}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      CREATE_ADMIN_USER: ${CREATE_ADMIN_USER:-true}
      USE_REDIS: ${USE_REDIS:-false}
      LANGUAGE: ${LANGUAGE:-}
      GB_API: ${GB_API:-}
      EASYCB_CONTACT: ${EASYCB_CONTACT:-}
    volumes:
      - ./:/app:cached
      - ./data/config:/app/config
      - ./data/export:/app/export
      - ./data/bookImages:/app/static/bookImages
      - ./data/eBooks:/app/static/eBooks
    ports:
      - "8000:8000"
    command: ["./entrypoint.sh"]
    # Use a bind mount so edits you make on the host are visible inside the container.
    # The image will run uvicorn with --reload (because DEV=true) and pick up changes.
